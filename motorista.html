<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Veicular</title>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

const itens = [
"Buzina",
"Pisca Alerta",
"Setas",
"Farol",
"Luz de Freio",
"Freio de Pedal",
"Luz de Ré",
"Freio de Mão",
"Embreagem",
"Câmbio",
"Cintos de Segurança",
"Retrovisores",
"Limpador Para-brisa",
"Extintor",
"Estepe",
"Bateria",
"Escapamento",
"Pneu Traseiro",
"Pneu Dianteiro",
"Água Radiador",
"Óleo Motor",
"Vazamentos",
"Limpeza",
"Documento Veículo",
"Capacete",
"Luva",
"Óculos"
];

window.addEventListener("DOMContentLoaded", () => {

  carregarAbertos();

  const lista = document.getElementById("lista");

  itens.forEach(item => {
    lista.innerHTML += `
      <div class="item">
        <div class="titulo">${item}</div>

        <label><input type="radio" name="${item}" value="OK" checked> OK</label>
        <label><input type="radio" name="${item}" value="ATENCAO"> Atenção</label>
        <label><input type="radio" name="${item}" value="MANUTENCAO"> Manutenção</label>
      </div>
    `;
  });
});

window.abrirFinalizacao = async function(id){

  const kmFinal = prompt("KM Final");

  if(!kmFinal) return;

  const agora = new Date();

  const dataFinal = agora.toISOString().split("T")[0];

  const horaFinal = agora.toTimeString().slice(0,5);

  const { data: checklist } = await supabase
    .from("checklists")
    .select("km_inicio")
    .eq("id", id)
    .single();

  const kmRodado =
    Number(kmFinal) - Number(checklist.km_inicio);

  const { error } = await supabase
    .from("checklists")
    .update({
  km_final: Number(kmFinal),
  km_rodado: kmRodado,
  data_final: dataFinal,
  hora_final: horaFinal,
 observacoes_retorno:
  document.getElementById("observacoes_retorno")?.value || "",

  status: "FINALIZADO"
})
    .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  alert(
    `Checklist Finalizado\n\nKM Rodado: ${kmRodado}`
  );

  carregarAbertos();
}


async function carregarAbertos(){

  const { data, error } = await supabase
    .from("checklists")
    .select("*")
    .eq("status","ABERTO")
    .order("criado_em",{ascending:false});

  if(error) return;

  const div = document.getElementById("abertos");

  div.innerHTML = "";

  data
.filter(c => c.placa && c.condutor)
.forEach(c => {

    div.innerHTML += `
      <div style="
        border:1px solid #ddd;
        padding:10px;
        margin-bottom:10px;
        border-radius:8px">

        <b>${c.placa}</b><br>
        Condutor: ${c.condutor}<br>
        KM Inicial: ${c.km_inicio}<br>

        <button
          onclick="abrirFinalizacao('${c.id}')">
          Finalizar
        </button>

      </div>
    `;
  });
}

window.mostrarAba = function(aba){

  document.getElementById("abaNovo")
    .style.display = "none";

  document.getElementById("abaAbertos")
    .style.display = "none";

  if(aba === "novo"){
    document.getElementById("abaNovo")
      .style.display = "block";
  }

  if(aba === "abertos"){
    document.getElementById("abaAbertos")
      .style.display = "block";
  }
}

window.salvarChecklist = async () => {

const observacoes = document.getElementById("observacoes").value;

  if(
 !document.getElementById("condutor").value ||
 !document.getElementById("placa").value
){
  alert("Preencha Condutor e Placa");
  return;
}

  const { data, error } = await supabase
    .from("checklists")
    .insert({
  observacoes,

  condutor: document.getElementById("condutor").value,
  placa: document.getElementById("placa").value,
  finalidade: document.getElementById("finalidade").value,

  data_inicio: document.getElementById("data_inicio").value || null,
  hora_inicio: document.getElementById("hora_inicio").value || null,
  km_inicio: Number(document.getElementById("km_inicio").value || 0),

  data_final: null,
  hora_final: null,
  km_final: null,

  status: "ABERTO"
})
    .select()
    .single();

  if(error){
    alert(error.message);
    return;
  }

  for(const item of itens){

    const status = document.querySelector(
      `input[name="${item}"]:checked`
    ).value;

    await supabase
      .from("checklist_itens")
      .insert({
        checklist_id: data.id,
        item,
        status
      });
  }

  alert("Checklist salvo com sucesso");

  location.reload();
}
</script>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  margin:0;
  padding:15px;
}

.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  box-sizing:border-box;
}

.item{
  border:1px solid #ddd;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
}

.titulo{
  font-weight:bold;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:15px;
  background:#28a745;
  color:white;
  border:none;
  border-radius:8px;
  font-size:18px;
}

#abaNovo{
 display:block;
}

#abaAbertos{
 display:none;
}
</style>
</head>

<body>

<div class="container">
<div class="abas">

<button onclick="mostrarAba('novo')">
Novo Checklist
</button>

<button onclick="mostrarAba('abertos')">
Checklists Abertos
</button>

</div>

<div id="abaNovo">

<h2>Checklist Diário</h2>

<input id="condutor" placeholder="Condutor">

<input id="placa" placeholder="Placa">

<input id="finalidade" placeholder="Finalidade">

<label>Data Início</label>
<input id="data_inicio" type="date">

<label>Hora Início</label>
<input id="hora_inicio" type="time">

<label>KM Inicial</label>
<input id="km_inicio" type="number">

<div id="abaAbertos" style="display:none">

<h3>Checklists Abertos</h3>

<div id="abertos"></div>

<h3>Retorno do Veículo</h3>

<textarea
id="observacoes_retorno"
rows="4"
placeholder="Observações do retorno do veículo">
</textarea>


</div>

<hr>

<div id="lista"></div>

<textarea
id="observacoes"
rows="5"
placeholder="Observações">
</textarea>

<button onclick="salvarChecklist()">
Salvar Checklist
</button>

</div>

</body>
</html>
