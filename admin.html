<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Checklist</title>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://bzgvbghxmebdjqnlakbj.supabase.co",
  "sb_publishable_IyvZNwtgkvECR0QVlYbhzw_zPL1TMJv"
);

async function carregar(){

  const { data, error } = await supabase
    .from("checklists")
    .select("*")
    .order("criado_em",{ascending:false});

  if(error){
    alert(error.message);
    return;
  }

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.forEach(c => {

    const dataFormatada =
      new Date(c.criado_em).toLocaleString("pt-BR");

    tbody.innerHTML += `
      <tr>
        <td>${dataFormatada}</td>
        <td>${c.motorista || ""}</td>
        <td>${c.veiculo || ""}</td>
        <td>${c.km || 0}</td>
        <td>
          <button onclick="verChecklist('${c.id}')">
            Ver
          </button>

          <button onclick="excluirChecklist('${c.id}')"
          style="background:#dc3545">
            Excluir
          </button>
        </td>
      </tr>
    `;
  });
}

window.verChecklist = async function(id){

  const { data } = await supabase
    .from("checklist_itens")
    .select("*")
    .eq("checklist_id",id);

  let html = "";

  data.forEach(item=>{

    let cor = "#28a745";

    if(item.status === "ATENCAO")
      cor = "#ffc107";

    if(item.status === "MANUTENCAO")
      cor = "#dc3545";

    html += `
      <div style="
      margin-bottom:8px;
      padding:8px;
      border-left:5px solid ${cor};
      background:#f5f5f5">
        <b>${item.item}</b><br>
        ${item.status}
      </div>
    `;
  });

  document.getElementById("detalhes").innerHTML = html;

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

window.excluirChecklist = async function(id){

  if(!confirm("Excluir checklist?"))
    return;

  await supabase
    .from("checklists")
    .delete()
    .eq("id",id);

  carregar();
}

window.onload = carregar;

</script>

<style>

body{
  font-family:Arial;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

h1{
  text-align:center;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#222;
  color:white;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

button{
  border:none;
  color:white;
  background:#007bff;
  padding:8px 12px;
  border-radius:5px;
  cursor:pointer;
}

#detalhes{
  margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Gerenciamento de Checklist</h1>

<table>

<thead>
<tr>
<th>Data</th>
<th>Motorista</th>
<th>Veículo</th>
<th>KM</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<h2>Detalhes do Checklist</h2>

<div id="detalhes">

Selecione um checklist para visualizar.

</div>

</div>

</body>
</html>
